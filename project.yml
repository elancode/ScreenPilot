name: ScreenPilot
options:
  bundleIdPrefix: com.screenpilot
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  ScreenPilot:
    type: application
    platform: macOS
    sources:
      - path: ScreenPilot
        excludes:
          - "**/*.entitlements"
    info:
      path: ScreenPilot/Info.plist
      properties:
        LSUIElement: true
        NSScreenCaptureUsageDescription: "ScreenPilot captures your screen to provide real-time technical guidance and task assistance."
        NSAppleEventsUsageDescription: "ScreenPilot monitors window titles to understand your current context."
    entitlements:
      path: ScreenPilot/ScreenPilot.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screenpilot.app
        PRODUCT_NAME: ScreenPilot
        INFOPLIST_FILE: ScreenPilot/Info.plist
        CODE_SIGN_ENTITLEMENTS: ScreenPilot/ScreenPilot.entitlements
        CODE_SIGN_IDENTITY: "Developer ID Application"
        CODE_SIGN_STYLE: "Manual"
        CODE_SIGNING_REQUIRED: "YES"
        CODE_SIGNING_ALLOWED: "YES"
        PROVISIONING_PROFILE_SPECIFIER: ""
        DEVELOPMENT_TEAM: "HN2BGT46R6"
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
    scheme:
      testTargets:
        - ScreenPilotTests

  ScreenPilotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ScreenPilotTests
    dependencies:
      - target: ScreenPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screenpilot.tests
        GENERATE_INFOPLIST_FILE: "YES"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ScreenPilot.app/Contents/MacOS/ScreenPilot"
